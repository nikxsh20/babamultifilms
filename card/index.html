<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a3a">
  <meta name="description" content="Digital business card for Nikhil Sharma, Designated Partner, Baba Multifilms LLP.">
  <title>Nikhil Sharma | Baba Multifilms LLP</title>
  <style>
    :root {
      --navy:#071a3a;
      --navy2:#0d2b59;
      --red:#b70f18;
      --ink:#111827;
      --muted:#667085;
      --line:#e7eaf0;
      --bg:#f5f7fa;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100vh;
    }
    .wrap { max-width:460px; margin:0 auto; padding:20px 16px 32px; }
    .card {
      background:#fff; border-radius:26px; overflow:hidden;
      box-shadow:0 16px 50px rgba(7,26,58,.12);
      border:1px solid rgba(7,26,58,.06);
    }
    .hero {
      background:linear-gradient(145deg,var(--navy),var(--navy2));
      padding:28px 24px 26px; color:#fff; position:relative;
    }
    .hero:after {
      content:""; position:absolute; width:190px; height:190px; border-radius:50%;
      right:-90px; top:-90px; border:1px solid rgba(255,255,255,.12);
    }
    .logo { width:100%; max-width:390px; height:auto; display:block; background:#fff; padding:10px; border-radius:12px; }
    .name { margin:28px 0 5px; font-size:29px; line-height:1.05; letter-spacing:.02em; font-weight:750; }
    .role { margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; opacity:.78; }
    .tagline {
      margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,.22);
      font-size:12px; letter-spacing:.18em; text-transform:uppercase; opacity:.88;
    }
    .body { padding:20px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn {
      text-decoration:none; color:var(--navy); border:1px solid var(--line);
      border-radius:14px; padding:13px 12px; text-align:center; font-weight:700; font-size:14px;
      background:#fff;
    }
    .btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
    .section { margin-top:22px; }
    .label { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:800; }
    .value { margin-top:6px; font-size:15px; line-height:1.45; }
    .value a { color:var(--navy); text-decoration:none; }
    .save {
      width:100%; margin-top:18px; border:0; border-radius:14px; padding:15px;
      background:var(--red); color:#fff; font-size:15px; font-weight:800; cursor:pointer;
    }
    .footer { text-align:center; color:#98a2b3; font-size:11px; margin-top:18px; }
  </style>
</head>
